                - generic [ref=f6e185]:
                  - heading "The IDE rebuilt for product managers" [level=3] [ref=f6e186]
                  - generic [ref=f6e187]: PMIDE puts product managers, engineers, and AI agents in the same repository. Manage governed context, generate agent-ready Work Packages, create reusable skills, work safely on draft branches, and review product intent — all inside a real IDE.
                  - generic [ref=f6e188]: The core value is not that PMs can code. It is that PMs can manage the context and agentic work system that increasingly determines what code gets produced.
                - generic [ref=f6e191]:
                  - heading "The golden flow (Demo Mode)" [level=3] [ref=f6e192]
                  - generic [ref=f6e193]: Planning session → context update → safe draft branch → skill creation → Work Package → agent routing → code change → Product Intent Review → governed delivery.
                  - generic [ref=f6e194]:
                    - text: The scripted walkthrough is off by default. Run
                    - code [ref=f6e195]: "PMIDE: Enable Demo Mode"
                    - text: from the command palette (F1) or the PMIDE menu to bootstrap the demo workspace and walk the full flow.
                    - code [ref=f6e196]: "PMIDE: Disable Demo Mode"
                    - text: turns it back off.
                - generic [ref=f6e199]:
                  - heading "Safe by default" [level=3] [ref=f6e200]
                  - generic [ref=f6e201]: You are always shown which branch you are on. Nothing changes in the shared product until a safe draft branch is reviewed and approved. High-risk context, skills with scripts, and agent runs all require explicit approval.
                - generic [ref=f6e204]:
                  - heading "Agents are governed teammates" [level=3] [ref=f6e205]
                  - generic [ref=f6e206]: Every agent run records who initiated it, the context it saw, the skill it used, and what changed — traceable from planning decision to pull request.
                - generic [ref=f6e209]:
                  - heading "Built on Eclipse Theia" [level=3] [ref=f6e210]
                  - generic [ref=f6e211]:
                    - text: PMIDE is built on the open-source
                    - button "Eclipse Theia platform" [ref=f6e212] [cursor=pointer]
                    - text: — not a fork of VS Code. It supports VS Code extensions via the
                    - button "Open VSX registry" [ref=f6e213] [cursor=pointer]
                    - text: .
                - generic [ref=f6e216]:
                  - heading "Context is the product artifact" [level=3] [ref=f6e217]
                  - generic [ref=f6e218]: The Context Library treats business rules, domain glossaries, compliance rules, and release constraints as version-controlled, owned, and reviewed assets — the inputs that make agent output trustworthy.
                - generic [ref=f6e223]:
                  - heading "🚀 AI Support in PMIDE is available! ✨" [level=3] [ref=f6e224]
                  - paragraph [ref=f6e227]:
                    - text: PMIDE now contains AI support, offering powerful AI capabilities within your IDE.Please note that these features are disabled by default, ensuring that users can opt-in at their discretion. For those who choose to enable AI support, it is important to be aware that these may generate continuous requests to the language models (LLMs) you provide access to. This might incur costs that you need to monitor closely.For more details, please visit
                    - link "the documentation" [ref=f6e228] [cursor=pointer]:
